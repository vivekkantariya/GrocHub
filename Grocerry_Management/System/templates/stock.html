<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #344e41;
            color: #f5f5f5;
            padding: 0;
        }

        .menu-container {
            display: flex;
            transition: 0.5s;
        }

        .menu-container a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            padding: 0 15px;
            font-weight: lighter;
            font-size: 22px;
        }

        .menu-container a:hover {
            color: #02261a;
            /* padding: 0 15px; */
            font-weight: bolder;

        }

        nav {
            background-color: #9eb19b;
            color: rgb(0, 0, 0);
            padding: 0px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 500;
            width: 100%;
            height: 65px;
        }

        nav a {
            margin: 8px 18px;
            font-family: 'Jost', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: #02261a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            margin-top: 80px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 28px;
            color: #9eb19b;
            margin-bottom: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .header button:hover {
            background-color: #45a049;
        }

        .logo-container img {
            width: 55%;
            height: auto;
            max-width: 450px;
            display: block;
            margin: 0;
        }

        .search-filter {
            margin-bottom: 20px;
        }

        .search-filter input {
            width: 100%;
            padding: 10px;
            border: 1px solid #588157;
            border-radius: 5px;
            color: black;
            transition: border-color 0.3s;
        }

        .search-filter input:focus {
            border-color: #4CAF50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            color: black;
            border-radius: 8px;
            overflow: hidden;
        }

        table thead {
            background-color: #f2f2f2;
        }

        table th,
        table td {
            text-align: left;
            padding: 12px;
            border: 1px solid #ddd;
            transition: background-color 0.3s ease;
        }

        table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        table tr:hover {
            background-color: #f1f1f1;
        }

        .action-buttons button {
            margin-right: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .action-buttons button:hover {
            transform: scale(1.1);
        }

        .action-buttons .edit {
            background-color: #4CAF50;
            color: white;
        }

        .action-buttons .delete {
            background-color: #c82333;
            color: white;
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .popup-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .popup-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .popup-content button {
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .popup-content .save {
            background-color: #4CAF50;
            color: white;
        }

        .popup-content .cancel {
            background-color: #c82333;
            color: white;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
            }

            table {
                font-size: 14px;
            }

            .popup-content {
                max-width: 90%;
            }
        }
    </style>
    <script>
        const modal = document.getElementById('productModal');

        function openModal() {
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function saveProduct() {
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;

            if (name && price) {
                alert(`Product Saved: ${name}, $${price}`);
                closeModal();
            } else {
                alert('Please fill out all fields.');
            }
        }

        function editProduct(id) {
            alert(`Edit product with ID: ${id}`);
        }

        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                alert(`Product with ID ${id} deleted.`);
            }
        }
    </script>
</head>

<body>
    <nav>
        <div class="logo-container">
            <img src="https://i.ibb.co/bRnDCR8/Screenshot-2024-01-15-151540-transformed-removebg-preview-transformed.png"
                alt="Purohit Trading">
        </div>
        <div class="menu-container">
            <a href="{% url 'home' %}" onclick="showHome()">Home</a>
            <a href="{% url 'product_list' %}" onclick="showManageProduct()">Manage Products</a>
            <a href="{% url 'customer_list' %}" onclick="showCustomerPage()">Manage Customer</a>
            <a href="{% url 'stock' %}" onclick="scrollToSection()">Stock</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Stock Inventory</h1>
        </header>

        <div class="header">
            <button onclick="openModal()">+ Add Product</button>
        </div>

        <div class="search-filter">
            <input type="text" id="search" placeholder="Search for products...">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <td>{{ product.id }}</td>
                    <td>{{ product.name }}</td>
                    <td>${{ product.price }}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="edit" onclick="editProduct({{ product.id }})">Edit</button>
                            <button class="delete" onclick="deleteProduct({{ product.id }})">Delete</button>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4">No products found.</td>
                </tr>
                {% endfor %}
            </tbody>
            
            

        </table>
    </div>

    <!-- Popup Modal -->
    <div class="popup" id="productModal">
        <div class="popup-content">
            <h2>Add/Edit Product</h2>
            <form>
                <input type="text" id="productName" placeholder="Product Name">
                <input type="number" id="productPrice" placeholder="Price">
                <div>
                    <button type="button" class="save" onclick="saveProduct()">Save</button>
                    <button type="button" class="cancel" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('search');
        searchInput.addEventListener('input', function () {
            const filter = searchInput.value.toLowerCase();
            const rows = document.querySelectorAll('table tbody tr');
    
            rows.forEach(row => {
                const name = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
                if (name.includes(filter)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
    </script>
    
</body>


</html>
